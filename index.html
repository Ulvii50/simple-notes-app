<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Qeydlər</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <!-- ==================== Navbar ==================== -->
    <header class="navbar">
        <div class="navbar-container">

            <div class="logo">
                <span class="logo-mark">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M13 21h8" />
                        <path d="m15 5 4 4" />
                        <path
                            d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" />
                    </svg>
                </span>
                Qeydlər
            </div>

            <input id="search" class="search" type="search" placeholder="Qeydlərdə axtar" aria-label="Qeydlərdə axtar">

            <div class="theme-buttons">
                <button type="button" class="theme-btn sun" aria-label="İşıqlı rejim">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="4" />
                        <path
                            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                    </svg>
                </button>

                <button type="button" class="theme-btn moon" aria-label="Qaranlıq rejim">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path
                            d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401" />
                    </svg>
                </button>
            </div>

        </div>
    </header>


    <!-- ==================== Main ==================== -->
    <main class="main">
        <div class="main-container">

            <!-- ---------- Yeni qeyd formu ---------- -->
            <section class="notes-form-section">
                <form class="notes-form" novalidate>
                    <h2 class="form-title">Yeni qeyd</h2>

                    <div class="form-group">
                        <label for="note-title">Başlıq</label>
                        <input type="text" id="note-title" class="note-title" placeholder="Qeydin başlığını yaz"
                            name="note-title" required>
                        <small class="error-msg" id="title-error"></small>
                    </div>

                    <div class="form-group">
                        <label for="note-content">Məzmun</label>
                        <textarea id="note-content" class="note-content" placeholder="Qeydin məzmununu yaz..."
                            name="note-content" rows="6" required></textarea>
                    </div>

                    <div class="form-bottom">
                        <div class="note-stats">
                            <span class="word-count">0 söz</span>,
                            <span class="char-count">0 simvol</span>
                        </div>
                        <div class="form-actions">
                            <button type="button" id="cancel-btn" class="btn btn-outline">Ləğv et</button>
                            <button type="submit" id="submit-btn" class="btn btn-blue">Əlavə et</button>
                        </div>
                    </div>
                </form>
            </section>

            <!-- ---------- Qeydlər siyahısı ---------- -->
            <section class="notes-section">
                <div class="notes-toolbar">
                    <span class="notes-count"></span>

                    <div class="notes-sort-buttons">
                        <button class="sort-btn active" type="button" data-sort="newest">Ən yeni</button>
                        <button class="sort-btn" type="button" data-sort="oldest">Ən köhnə</button>
                        <button class="sort-btn" type="button" data-sort="az">A-Z</button>
                    </div>
                </div>

                <div class="notes-list"></div>
                <div class="empty"></div>
            </section>

        </div>
    </main>


    <!-- ==================== Modal ==================== -->
    <div class="modal" id="note-modal" hidden>
        <div class="modal-box" id="modal-box" role="dialog" aria-modal="true">

            <!-- ---------- Baxış paneli ---------- -->
            <div class="modal-panel" id="modal-view">
                <div class="modal-head">
                    <h2 class="modal-title" id="view-title"></h2>
                    <div class="modal-actions">
                        <button type="button" class="btn btn-red-outline" id="open-delete-btn">Sil</button>
                        <button type="button" class="btn btn-blue-outline" id="open-edit-btn">Redaktə et</button>
                        <button type="button" class="modal-close" aria-label="Bağla">✕</button>
                    </div>
                </div>

                <div class="modal-body">
                    <p class="modal-content" id="view-content"></p>
                </div>

                <div class="modal-footer">
                    <span id="view-date"></span>
                    <span id="view-stats"></span>
                </div>
            </div>

            <!-- ---------- Redaktə paneli ---------- -->
            <div class="modal-panel" id="modal-edit" hidden>
                <div class="modal-head">
                    <h2 class="modal-title">Qeydi redaktə et</h2>
                    <div class="modal-actions">
                        <button type="button" class="btn btn-outline" id="cancel-edit-btn">Ləğv et</button>
                        <button type="submit" form="modal-edit-form" class="btn btn-blue-outline"
                            id="save-edit-btn">Yadda saxla</button>
                    </div>
                </div>

                <div class="modal-body">
                    <form id="modal-edit-form" novalidate>
                        <div class="form-group">
                            <label for="edit-title">Başlıq</label>
                            <input type="text" id="edit-title" class="note-title" placeholder="Qeydin başlığını yaz"
                                name="edit-title" required>
                            <small class="error-msg" id="edit-title-error"></small>
                        </div>
                        <div class="form-group grow">
                            <label for="edit-content">Məzmun</label>
                            <textarea id="edit-content" class="note-content" placeholder="Qeydin məzmununu yaz..."
                                name="edit-content" required></textarea>
                        </div>
                    </form>
                </div>

                <div class="modal-footer">
                    <div id="edit-stats">
                        <span id="edit-count-word">0 söz</span>,
                        <span id="edit-count-char">0 simvol</span>
                    </div>
                </div>
            </div>

            <!-- ---------- Silmə paneli ---------- -->
            <div class="modal-panel" id="modal-delete" hidden>
                <h2 class="modal-title">Qeydi silmək istəyirsən?</h2>

                <p class="modal-text">Bu əməliyyat geri qaytarılmır.</p>
                <small class="error-msg" id="delete-error"></small>

                <div class="modal-actions">
                    <button type="button" class="btn btn-outline" id="cancel-delete-btn">Xeyr</button>
                    <button type="button" class="btn btn-red-outline" id="confirm-delete-btn">Bəli, sil</button>
                </div>
            </div>

        </div>
    </div>


    <script src="./js/script.js"></script>
</body>

</html>
